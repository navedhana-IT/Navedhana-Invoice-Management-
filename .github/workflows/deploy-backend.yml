name: Deploy Backend via Coolify

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Coolify Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Call Coolify Deploy Webhook
        run: |
          if [ -z "${{ secrets.COOLIFY_BACKEND_WEBHOOK }}" ]; then
            echo "::error::Secret COOLIFY_BACKEND_WEBHOOK is not set in GitHub repository secrets! Please add it under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering deployment in Coolify..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.COOLIFY_BACKEND_WEBHOOK }}")
          http_status=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS/d')
          echo "Response: $body"
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Coolify deployment triggered successfully (HTTP $http_status)."
          else
            echo "::error::Coolify deployment trigger failed with HTTP $http_status"
            exit 1
          fi
