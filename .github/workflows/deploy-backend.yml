name: Deploy Backend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          # Alternatively, use SSH key (recommended):
          # key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: 22
          script: |
            # Navigate to the project directory on your Hostinger server
            # Replace with your actual path, e.g., /var/www/navedhana or /home/username/project
            cd /path/to/your/project/Navedhana-Invoice-Management-/backend
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Installing dependencies..."
            npm install
            
            echo "Generating Prisma client..."
            npm run db:generate
            
            echo "Deploying database migrations..."
            npm run db:deploy
            
            echo "Building the backend..."
            npm run build
            
            echo "Restarting the backend service..."
            # Assuming you are using PM2 to keep the server running
            # If your PM2 process is named differently, change 'navedhana-backend' to your process name
            pm2 restart navedhana-backend || pm2 start npm --name "navedhana-backend" -- run start
            
            echo "Deployment successful!"
